<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Who's the Next Millionaire</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a1622;
    --panel:#101f30;
    --panel-alt:#16283c;
    --line:#22384f;
    --gold:#e7b85c;
    --gold-dim:#8a6a34;
    --cyan:#45d6c7;
    --text:#edf1f5;
    --muted:#7c93a8;
    --danger:#e06c63;
    --correct:#57c785;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 15% 10%, rgba(69,214,199,0.07), transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(231,184,92,0.06), transparent 45%),
      var(--bg);
    color:var(--text);
    font-family:'Space Grotesk', sans-serif;
    min-height:100vh;
    overflow-x:hidden;
  }
  #net-bg{
    position:fixed; inset:0; z-index:0; opacity:0.5; pointer-events:none;
  }
  #app{
    position:relative; z-index:1;
    max-width:1100px; margin:0 auto;
    padding:28px 20px 60px;
  }

  /* ---------- Header ---------- */
  header{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:22px; flex-wrap:wrap; gap:12px;
  }
  .brand{ display:flex; align-items:center; gap:12px; }
  .brand svg{ flex-shrink:0; }
  .brand h1{
    font-size:1.5rem; margin:0; font-weight:600; letter-spacing:0.01em;
  }
  .brand h1 span{ color:var(--gold); }
  .brand p{ margin:2px 0 0; color:var(--muted); font-size:0.82rem; }
  #restart-top{
    background:transparent; border:1px solid var(--line); color:var(--muted);
    padding:8px 14px; border-radius:20px; font-family:inherit; font-size:0.82rem;
    cursor:pointer; transition:border-color .15s, color .15s;
  }
  #restart-top:hover{ border-color:var(--cyan); color:var(--cyan); }

  /* ---------- Stage layout ---------- */
  .stage{
    display:grid; grid-template-columns: 1fr 260px; gap:20px;
  }
  @media (max-width: 760px){
    .stage{ grid-template-columns: 1fr; }
    .ladder{ order:2; }
  }

  /* ---------- Question panel ---------- */
  .panel{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:22px;
  }
  .lifelines{
    display:flex; gap:10px; margin-bottom:18px; flex-wrap:wrap;
  }
  .lifeline-btn{
    display:flex; align-items:center; gap:8px;
    background:var(--panel-alt); border:1px solid var(--line);
    color:var(--text); padding:8px 14px; border-radius:20px;
    font-family:inherit; font-size:0.8rem; cursor:pointer;
    transition:transform .12s, border-color .15s;
  }
  .lifeline-btn:hover:not(:disabled){ border-color:var(--cyan); transform:translateY(-1px); }
  .lifeline-btn:disabled{ opacity:0.35; cursor:not-allowed; }
  .lifeline-btn .dot{
    width:8px; height:8px; border-radius:50%; background:var(--cyan);
  }

  .prize-current{
    color:var(--muted); font-size:0.85rem; margin:0 0 6px;
  }
  .prize-current strong{ color:var(--gold); }
  #question-text{
    font-family:'Source Serif 4', serif; font-weight:600;
    font-size:1.45rem; line-height:1.4; margin:0 0 22px; color:var(--text);
  }

  .options-grid{
    display:grid; grid-template-columns:1fr 1fr; gap:12px;
  }
  @media (max-width:520px){ .options-grid{ grid-template-columns:1fr; } }
  .option{
    display:flex; align-items:center; gap:12px; text-align:left;
    background:var(--panel-alt); border:1px solid var(--line);
    color:var(--text); padding:14px 16px; border-radius:var(--radius);
    font-family:'Source Serif 4', serif; font-size:1rem;
    cursor:pointer; transition:border-color .15s, background .15s, transform .1s;
  }
  .option:hover:not(:disabled){ border-color:var(--cyan); transform:translateY(-1px); }
  .option .letter{
    font-family:'Space Grotesk', sans-serif; font-weight:600;
    width:26px; height:26px; border-radius:50%;
    border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center;
    font-size:0.85rem; color:var(--muted); flex-shrink:0;
  }
  .option.selected{ border-color:var(--gold); }
  .option.selected .letter{ border-color:var(--gold); color:var(--gold); }
  .option.correct{ border-color:var(--correct); background:rgba(87,199,133,0.12); }
  .option.correct .letter{ border-color:var(--correct); color:var(--correct); }
  .option.wrong{ border-color:var(--danger); background:rgba(224,108,99,0.12); }
  .option.wrong .letter{ border-color:var(--danger); color:var(--danger); }
  .option.eliminated{ opacity:0.25; pointer-events:none; }
  .option:disabled{ cursor:default; }

  .controls{
    display:flex; justify-content:space-between; align-items:center;
    margin-top:22px; flex-wrap:wrap; gap:10px;
  }
  #walk-away{
    background:transparent; border:1px solid var(--line); color:var(--muted);
    padding:9px 16px; border-radius:20px; font-family:inherit; font-size:0.85rem;
    cursor:pointer;
  }
  #walk-away:hover:not(:disabled){ border-color:var(--danger); color:var(--danger); }
  #walk-away:disabled{ opacity:0.3; cursor:not-allowed; }

  #confirm-btn{
    background:var(--gold); border:none; color:#1a1206;
    padding:10px 20px; border-radius:20px; font-family:inherit; font-weight:600;
    font-size:0.85rem; cursor:pointer; opacity:0; pointer-events:none;
    transition:opacity .15s;
  }
  #confirm-btn.visible{ opacity:1; pointer-events:auto; }

  /* ---------- audience / friend overlays ---------- */
  .helper-box{
    margin-top:18px; padding:14px 16px; border-radius:var(--radius);
    background:var(--panel-alt); border:1px solid var(--line);
    font-size:0.85rem; display:none;
  }
  .helper-box.visible{ display:block; }
  .helper-box h4{ margin:0 0 10px; font-size:0.78rem; color:var(--muted); font-weight:500; }
  .bar-row{ display:flex; align-items:center; gap:10px; margin-bottom:6px; }
  .bar-row .bar-label{ width:18px; color:var(--muted); font-size:0.8rem; }
  .bar-row .bar-track{ flex:1; height:14px; background:var(--bg); border-radius:4px; overflow:hidden; }
  .bar-row .bar-fill{ height:100%; background:var(--cyan); width:0%; transition:width .6s ease; }
  .bar-row .bar-pct{ width:36px; text-align:right; color:var(--muted); font-size:0.78rem; }
  .friend-quote{ font-family:'Source Serif 4', serif; font-style:italic; color:var(--text); line-height:1.5; }

  /* ---------- ladder ---------- */
  .ladder{
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    padding:14px 10px; display:flex; flex-direction:column-reverse;
    gap:4px; height:fit-content;
  }
  .rung{
    display:flex; align-items:center; justify-content:space-between;
    padding:7px 12px; border-radius:6px; font-size:0.85rem; color:var(--muted);
  }
  .rung .num{ opacity:0.6; margin-right:8px; font-size:0.75rem; }
  .rung.safe{ color:var(--gold); }
  .rung.safe::after{ content:'●'; font-size:0.5rem; margin-left:6px; color:var(--gold); }
  .rung.current{
    background:var(--panel-alt); color:var(--gold); font-weight:600;
    border:1px solid var(--gold-dim);
  }
  .rung.passed{ color:var(--cyan); }

  /* ---------- overlay end-screens ---------- */
  #overlay{
    position:fixed; inset:0; background:rgba(6,12,18,0.88);
    display:none; align-items:center; justify-content:center; z-index:10;
    padding:20px;
  }
  #overlay.visible{ display:flex; }
  .end-card{
    background:var(--panel); border:1px solid var(--line); border-radius:14px;
    padding:36px 32px; max-width:420px; text-align:center;
  }
  .end-card .icon{ font-size:2.2rem; margin-bottom:10px; }
  .end-card h2{ margin:0 0 8px; font-size:1.4rem; }
  .end-card p{ color:var(--muted); margin:0 0 22px; line-height:1.5; font-size:0.9rem; }
  .end-card .amount{ color:var(--gold); font-weight:700; }
  .end-card button{
    background:var(--gold); border:none; color:#1a1206; font-family:inherit;
    font-weight:600; padding:11px 26px; border-radius:20px; cursor:pointer; font-size:0.9rem;
  }
</style>
</head>
<body>

<svg id="net-bg"></svg>

<div id="app">
  <header>
    <div class="brand">
      <svg width="34" height="34" viewBox="0 0 34 34" fill="none">
        <circle cx="7" cy="7" r="3" fill="#45d6c7"/>
        <circle cx="27" cy="7" r="3" fill="#45d6c7"/>
        <circle cx="17" cy="27" r="3" fill="#e7b85c"/>
        <line x1="7" y1="7" x2="27" y2="7" stroke="#22384f" stroke-width="1.5"/>
        <line x1="7" y1="7" x2="17" y2="27" stroke="#22384f" stroke-width="1.5"/>
        <line x1="27" y1="7" x2="17" y2="27" stroke="#22384f" stroke-width="1.5"/>
      </svg>
      <div>
        <h1>Who's the Next <span>Millionaire</span></h1>
        <p>fifteen questions between you and the top of the ladder</p>
      </div>
    </div>
    <button id="restart-top">restart game</button>
  </header>

  <div class="stage">
    <section class="panel">
      <div class="lifelines">
        <button class="lifeline-btn" id="ll-5050"><span class="dot"></span>50:50</button>
        <button class="lifeline-btn" id="ll-audience"><span class="dot"></span>ask the audience</button>
        <button class="lifeline-btn" id="ll-friend"><span class="dot"></span>phone a friend</button>
      </div>

      <p class="prize-current">question <strong id="q-num">1</strong> of 15 &nbsp;·&nbsp; playing for <strong id="q-prize">$100</strong></p>
      <h2 id="question-text">Loading question…</h2>

      <div class="options-grid" id="options-grid"></div>

      <div class="helper-box" id="audience-box">
        <h4>the audience says</h4>
        <div id="audience-bars"></div>
      </div>
      <div class="helper-box" id="friend-box">
        <h4>your friend says</h4>
        <p class="friend-quote" id="friend-text"></p>
      </div>

      <div class="controls">
        <button id="walk-away">walk away with current winnings</button>
        <button id="confirm-btn">lock in final answer</button>
      </div>
    </section>

    <aside class="ladder" id="ladder"></aside>
  </div>
</div>

<div id="overlay">
  <div class="end-card">
    <div class="icon" id="end-icon">🏆</div>
    <h2 id="end-title">You did it!</h2>
    <p id="end-desc">You've walked away with <span class="amount" id="end-amount">$0</span>.</p>
    <button id="play-again">play again</button>
  </div>
</div>

<script>
(function(){

  /* =====================================================
     QUESTION BANK — edit this array to customize the quiz.
     Each question needs: text, options (4), correct (index 0-3).
     Keep them roughly in increasing order of difficulty to
     match the prize ladder below.
  ===================================================== */
  const QUESTIONS = [
    { text:"Which planet is known as the Red Planet?", options:["Venus","Mars","Jupiter","Saturn"], correct:1 },
    { text:"How many continents are there on Earth?", options:["5","6","7","8"], correct:2 },
    { text:"What is the capital city of Japan?", options:["Seoul","Beijing","Tokyo","Bangkok"], correct:2 },
    { text:"Which gas do plants primarily absorb from the atmosphere?", options:["Oxygen","Carbon dioxide","Nitrogen","Helium"], correct:1 },
    { text:"Who painted the Mona Lisa?", options:["Michelangelo","Raphael","Leonardo da Vinci","Donatello"], correct:2 },
    { text:"What is the largest ocean on Earth?", options:["Atlantic","Indian","Arctic","Pacific"], correct:3 },
    { text:"In computing, what does 'HTTP' stand for?", options:["HyperText Transfer Protocol","High Traffic Transit Process","Hyperlink Text Transport Program","Home Tool Transfer Protocol"], correct:0 },
    { text:"Which element has the chemical symbol 'Fe'?", options:["Fluorine","Iron","Lead","Tin"], correct:1 },
    { text:"The Great Barrier Reef is located off the coast of which country?", options:["Brazil","Mexico","Australia","South Africa"], correct:2 },
    { text:"Which author wrote '1984' and 'Animal Farm'?", options:["Aldous Huxley","George Orwell","Ray Bradbury","H.G. Wells"], correct:1 },
    { text:"What is the smallest prime number?", options:["0","1","2","3"], correct:2 },
    { text:"Which country was formerly known as Persia?", options:["Iraq","Turkey","Iran","Egypt"], correct:2 },
    { text:"In Greek mythology, who is the god of the sea?", options:["Zeus","Hades","Apollo","Poseidon"], correct:3 },
    { text:"What is the standard unit of electrical resistance?", options:["Volt","Watt","Ohm","Ampere"], correct:2 },
    { text:"Which programming language's name references a British comedy troupe?", options:["Java","Python","Ruby","Rust"], correct:1 }
  ];

  const PRIZES = [100,200,300,500,1000,2000,4000,8000,16000,32000,64000,125000,250000,500000,1000000];
  const SAFE_HAVENS = [5,10]; // 1-indexed question numbers

  function fmt(n){ return '$' + n.toLocaleString('en-US'); }

  let state = {};

  function resetState(){
    state = {
      current: 0,
      lifelines:{ fifty:false, audience:false, friend:false },
      selected: null,
      locked: false,
      eliminated: []
    };
  }

  const els = {
    qNum: document.getElementById('q-num'),
    qPrize: document.getElementById('q-prize'),
    qText: document.getElementById('question-text'),
    grid: document.getElementById('options-grid'),
    ladder: document.getElementById('ladder'),
    confirmBtn: document.getElementById('confirm-btn'),
    walkAway: document.getElementById('walk-away'),
    audienceBox: document.getElementById('audience-box'),
    audienceBars: document.getElementById('audience-bars'),
    friendBox: document.getElementById('friend-box'),
    friendText: document.getElementById('friend-text'),
    overlay: document.getElementById('overlay'),
    endIcon: document.getElementById('end-icon'),
    endTitle: document.getElementById('end-title'),
    endDesc: document.getElementById('end-desc'),
    endAmount: document.getElementById('end-amount'),
    ll5050: document.getElementById('ll-5050'),
    llAudience: document.getElementById('ll-audience'),
    llFriend: document.getElementById('ll-friend'),
  };

  function buildLadder(){
    els.ladder.innerHTML = '';
    PRIZES.forEach((p, i)=>{
      const n = i+1;
      const div = document.createElement('div');
      div.className = 'rung';
      if (SAFE_HAVENS.includes(n)) div.classList.add('safe');
      div.dataset.n = n;
      div.innerHTML = `<span><span class="num">${n}</span>${fmt(p)}</span>`;
      els.ladder.appendChild(div);
    });
  }

  function updateLadder(){
    document.querySelectorAll('.rung').forEach(r=>{
      const n = parseInt(r.dataset.n,10);
      r.classList.remove('current','passed');
      if (n === state.current+1) r.classList.add('current');
      else if (n <= state.current) r.classList.add('passed');
    });
  }

  function renderQuestion(){
    state.selected = null;
    state.locked = false;
    state.eliminated = [];
    els.confirmBtn.classList.remove('visible');
    els.audienceBox.classList.remove('visible');
    els.friendBox.classList.remove('visible');

    const q = QUESTIONS[state.current];
    els.qNum.textContent = state.current+1;
    els.qPrize.textContent = fmt(PRIZES[state.current]);
    els.qText.textContent = q.text;

    els.grid.innerHTML = '';
    q.options.forEach((opt, idx)=>{
      const btn = document.createElement('button');
      btn.className = 'option';
      btn.innerHTML = `<span class="letter">${String.fromCharCode(65+idx)}</span><span>${opt}</span>`;
      btn.addEventListener('click', ()=> selectOption(idx));
      els.grid.appendChild(btn);
    });

    els.walkAway.disabled = state.current === 0;
    updateLadder();
  }

  function selectOption(idx){
    if (state.locked) return;
    if (state.eliminated.includes(idx)) return;
    state.selected = idx;
    document.querySelectorAll('.option').forEach((el,i)=>{
      el.classList.toggle('selected', i===idx);
    });
    els.confirmBtn.classList.add('visible');
  }

  els.confirmBtn.addEventListener('click', ()=>{
    if (state.selected === null || state.locked) return;
    lockAnswer();
  });

  function lockAnswer(){
    state.locked = true;
    els.confirmBtn.classList.remove('visible');
    const q = QUESTIONS[state.current];
    const opts = document.querySelectorAll('.option');
    opts.forEach(o=> o.disabled = true);

    setTimeout(()=>{
      opts[q.correct].classList.add('correct');
      if (state.selected !== q.correct){
        opts[state.selected].classList.add('wrong');
      }
      setTimeout(()=>{
        if (state.selected === q.correct){
          if (state.current === QUESTIONS.length - 1){
            endGame('win', PRIZES[PRIZES.length-1]);
          } else {
            state.current++;
            renderQuestion();
          }
        } else {
          const guaranteed = guaranteedAmount(state.current);
          endGame('lose', guaranteed);
        }
      }, 1400);
    }, 700);
  }

  function guaranteedAmount(currentIdx){
    // currentIdx is 0-based index of the question just failed
    let amount = 0;
    for (const n of SAFE_HAVENS){
      if (currentIdx >= n) amount = PRIZES[n-1];
    }
    return amount;
  }

  els.walkAway.addEventListener('click', ()=>{
    if (state.locked || state.current === 0) return;
    const amount = PRIZES[state.current-1];
    endGame('walk', amount);
  });

  function endGame(type, amount){
    els.overlay.classList.add('visible');
    if (type === 'win'){
      els.endIcon.textContent = '🏆';
      els.endTitle.textContent = "You're the Next Millionaire!";
      els.endDesc.innerHTML = `You answered all fifteen questions correctly and won <span class="amount">${fmt(amount)}</span>.`;
    } else if (type === 'walk'){
      els.endIcon.textContent = '🤝';
      els.endTitle.textContent = 'You walked away';
      els.endDesc.innerHTML = `You banked <span class="amount">${fmt(amount)}</span> before risking it all.`;
    } else {
      els.endIcon.textContent = '💫';
      els.endTitle.textContent = 'Game over';
      els.endDesc.innerHTML = amount > 0
        ? `That one got you — but your safe haven means you still leave with <span class="amount">${fmt(amount)}</span>.`
        : `That one got you — you leave with <span class="amount">${fmt(0)}</span>. Give it another go.`;
    }
  }

  document.getElementById('play-again').addEventListener('click', startGame);
  document.getElementById('restart-top').addEventListener('click', ()=>{
    if (confirm('Restart the game from question 1?')) startGame();
  });

  /* ---------- lifelines ---------- */
  els.ll5050.addEventListener('click', ()=>{
    if (state.lifelines.fifty || state.locked) return;
    state.lifelines.fifty = true;
    els.ll5050.disabled = true;
    const q = QUESTIONS[state.current];
    const wrongIdxs = [0,1,2,3].filter(i=> i!==q.correct);
    wrongIdxs.sort(()=>Math.random()-0.5);
    const toRemove = wrongIdxs.slice(0,2);
    const opts = document.querySelectorAll('.option');
    toRemove.forEach(i=>{
      opts[i].classList.add('eliminated');
      opts[i].disabled = true;
      state.eliminated.push(i);
    });
  });

  els.llAudience.addEventListener('click', ()=>{
    if (state.lifelines.audience || state.locked) return;
    state.lifelines.audience = true;
    els.llAudience.disabled = true;
    const q = QUESTIONS[state.current];
    const remaining = [0,1,2,3].filter(i=> !state.eliminated.includes(i));
    // weight correct answer higher, harder questions = less certain audience
    const difficulty = state.current / QUESTIONS.length; // 0..1
    const correctShare = Math.round(70 - difficulty*35 + Math.random()*10);
    let pcts = {};
    remaining.forEach(i=> pcts[i] = i===q.correct ? correctShare : 0);
    let remainder = 100 - correctShare;
    const others = remaining.filter(i=> i!==q.correct);
    others.forEach((i, idx)=>{
      const share = idx === others.length-1 ? remainder : Math.round(Math.random()*remainder/ (others.length-idx));
      pcts[i] = share;
      remainder -= share;
    });
    els.audienceBox.classList.add('visible');
    els.audienceBars.innerHTML = '';
    [0,1,2,3].forEach(i=>{
      const pct = pcts[i] || 0;
      const row = document.createElement('div');
      row.className = 'bar-row';
      row.innerHTML = `<span class="bar-label">${String.fromCharCode(65+i)}</span>
        <span class="bar-track"><span class="bar-fill" style="width:0%"></span></span>
        <span class="bar-pct">${pct}%</span>`;
      els.audienceBars.appendChild(row);
      requestAnimationFrame(()=>{
        row.querySelector('.bar-fill').style.width = pct + '%';
      });
    });
  });

  els.llFriend.addEventListener('click', ()=>{
    if (state.lifelines.friend || state.locked) return;
    state.lifelines.friend = true;
    els.llFriend.disabled = true;
    const q = QUESTIONS[state.current];
    const remaining = [0,1,2,3].filter(i=> !state.eliminated.includes(i));
    const difficulty = state.current / QUESTIONS.length;
    const friendKnows = Math.random() > difficulty * 0.5; // less reliable on hard questions
    const guessIdx = friendKnows ? q.correct : remaining[Math.floor(Math.random()*remaining.length)];
    const confidence = friendKnows ? (80 + Math.floor(Math.random()*15)) : (35 + Math.floor(Math.random()*25));
    const letter = String.fromCharCode(65 + guessIdx);
    els.friendBox.classList.add('visible');
    els.friendText.textContent = friendKnows
      ? `"Pretty sure it's ${letter} — I'd say I'm about ${confidence}% confident."`
      : `"Hmm, tough one. If I had to guess I'd go with ${letter}, but honestly only about ${confidence}% sure."`;
  });

  /* ---------- decorative network background ---------- */
  function drawNetBg(){
    const svg = document.getElementById('net-bg');
    const w = window.innerWidth, h = window.innerHeight;
    svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
    const nodeCount = Math.max(10, Math.floor(w/140));
    const nodes = Array.from({length:nodeCount}, ()=>({
      x: Math.random()*w, y: Math.random()*h
    }));
    let lines = '';
    nodes.forEach((n,i)=>{
      nodes.forEach((m,j)=>{
        if (j<=i) return;
        const d = Math.hypot(n.x-m.x, n.y-m.y);
        if (d < 220){
          lines += `<line x1="${n.x}" y1="${n.y}" x2="${m.x}" y2="${m.y}" stroke="#1c3348" stroke-width="1"/>`;
        }
      });
    });
    let dots = nodes.map(n=>`<circle cx="${n.x}" cy="${n.y}" r="2" fill="#22384f"/>`).join('');
    svg.innerHTML = lines + dots;
  }

  function startGame(){
    resetState();
    els.overlay.classList.remove('visible');
    [els.ll5050, els.llAudience, els.llFriend].forEach(b=> b.disabled=false);
    renderQuestion();
  }

  buildLadder();
  drawNetBg();
  window.addEventListener('resize', drawNetBg);
  startGame();

})();
</script>
</body>
</html>
